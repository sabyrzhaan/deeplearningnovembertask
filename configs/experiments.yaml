# Конфигурация экспериментов. ВСЁ, что влияет на обучение, лежит здесь.
# Контролируемый эксперимент = ровно ОДНО отличие между запусками (см. runs ниже).

model: yolo11n.pt        # маленькая модель, предобучена на COCO; одинаковая для обоих запусков
seed: 42                 # фиксируем случайность (инициализация, порядок батчей, аугментации)

common:                  # общие настройки обоих запусков
  epochs: 30
  batch: 16
  imgsz: 640
  optimizer: AdamW       # задаём явно: при optimizer=auto Ultralytics сам подбирает lr и игнорирует lr0
  lr0: 0.001
  lrf: 0.01              # итоговый lr = lr0 * lrf
  patience: 100          # > epochs, т.е. ранняя остановка выключена: бюджет обучения одинаков
  workers: 2
  deterministic: true

runs:
  baseline_640: {}                 # базовый запуск: без изменений
  exp_imgsz320: {imgsz: 320}       # эксперимент: единственное отличие — размер входного изображения

eval:
  val_conf: 0.001        # порог уверенности при расчёте mAP (стандарт Ultralytics: оставляем почти все рамки)
  nms_iou: 0.7           # порог IoU для NMS (подавление дублей)
  map_iou: 0.5           # mAP@0.50: рамка верна, если IoU с разметкой >= 0.5
  fixed_conf: 0.25       # «рабочая точка» для P/R и разбора ошибок
  fixed_match_iou: 0.5
